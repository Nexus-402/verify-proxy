# Release verify-proxy when a version tag arrives: a binary per OS and
# architecture with SHA-256 sums on the GitHub release, and a multi-arch
# image on ghcr.io. The tag is pushed by Nexus402's publisher when VERSION
# changes; this repository is a read-only copy of its source.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"
      - name: Check the tag is VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Test and build
        run: |
          set -euo pipefail
          go vet ./...
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="verify-proxy_${GITHUB_REF_NAME}_${os}_${arch}"
            bin="verify-proxy"; [ "$os" = windows ] && bin="verify-proxy.exe"
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/$name/$bin" .
            cp README.md LICENSE NOTICE "dist/$name/"
            if [ "$os" = windows ]; then (cd dist && zip -qr "$name.zip" "$name"); else tar -C dist -czf "dist/$name.tar.gz" "$name"; fi
            rm -rf "dist/$name"
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "verify-proxy ${GITHUB_REF_NAME}" --notes "Binaries for six platforms, SHA256SUMS, and ghcr.io/nexus-402/verify-proxy:${GITHUB_REF_NAME}."
      - name: Container image
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "${TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx create --use
          image="ghcr.io/nexus-402/verify-proxy"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/Nexus-402/verify-proxy" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            -t "${image}:${GITHUB_REF_NAME}" -t "${image}:latest" --push .
